name: Daily data refresh

on:
  schedule:
    # 10:30 UTC = 17:30 WIB — after IDX market close (~15:50 WIB). Runs
    # every day; on a non-trading day yfinance returns no new rows and
    # scripts/run_daily_scan.py just keeps the last trading day's data.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch OHLCV + build features
        run: python scripts/run_daily_scan.py

      - name: Fetch fundamentals + quality-filter snapshot
        # yfinance's fundamentals endpoint is more prone to being rate-limited
        # from shared CI IPs than the OHLCV history endpoint — don't let a
        # fundamentals hiccup block committing the OHLCV/features refresh above.
        continue-on-error: true
        run: python scripts/build_universe_snapshot.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
